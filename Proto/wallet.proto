
syntax = "proto3";

package wallet;

message GetBalanceRequest {
  // одно поле: идентификатор счёта
    string account_id = 1;
}

message GetBalanceResponse {
  // баланс
    int64 balance_minor = 1;
  // код валюты, например "KZT"
    string currency = 2;
}

// Одна транзакция в истории операций
message Transaction {
    string id = 1;
    int64 amount_minor = 2;
    string currency = 3;
    string description = 4;
    int64 timestamp = 5;
    string counterparty = 6;
}

message GetTransactionsRequest {
    string account_id = 1;
    // сколько транзакций вернуть — чтобы можно было замерять на разных объёмах
    int32 count = 2;
}

message GetTransactionsResponse {
    // repeated означает список
    repeated Transaction transactions = 1;
}

service WalletService {
  // один rpc: принимает GetBalanceRequest, возвращает GetBalanceResponse
    rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // большой ответ — для замера производительности против JSON
    rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

